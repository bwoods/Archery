[package]
name = "storage"
version = "0.0.0"
edition = "2024"

[dependencies]
flux-loom = "0.6.5"
tempfile = "3.27.0"
heed = { version = "0.22.1", default-features = false, features = ["posix-sem"]}
redb = "4.1.0"

truecalc-workbook = "8"
truecalc-core = "8"

arrow-array = "59.2.0"
arrow-schema = "59.2.0"
arrow-select = "59.2.0"
arrow-cast = "59.2.0"
arrow-csv = "59.2.0"
serde_arrow = { version = "0.15.0", features = ["arrow-59"] }
serde = "1.0.229"

fallible-iterator = "0.3.0"
itertools = "0.15.0"
ouroboros = "0.18.5"


# [[bin]] dependencies
simple_logger = { version = "5.2.0", optional = true }
reedline-repl-rs = { version = "1.3", features = ["derive", "scripts"], optional = true }
clap = { version = "4.6.5", features = ["derive", "wrap_help"], optional = true }
clap-verbosity-flag = { version = "3.0.4", optional = true }
clap-stdin = { version = "0.8.1", optional = true }
clap-file = { version = "0.3.0", optional = true }
clap-tui = { version = "0.2.0", optional = true }

directories = { version = "6.0", optional = true }
pulldown-cmark = { version = "0.13.4", optional = true }
comfy-table = { version = "8", optional = true }
termbg = { version = "0.6.2", optional = true }

wavefront_obj = "11.0.0"
forsyth = "1.0.1"
ufbx = "0.11.3"


[build-dependencies]


[patch.crates-io]
flux-loom = { path = "flux/crates/loom" } # has updated dependencies


[profile.release]
codegen-units = 1
incremental = false
debug = false
strip = true
lto = "fat"

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3


[[bin]]
name = "storage"
path = "src/cli/bin.rs"
required-features = [
    "clap", "clap-tui", "reedline-repl-rs", "clap-verbosity-flag",
    "simple_logger", "comfy-table", "termbg",
]

